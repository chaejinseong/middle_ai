# F6 규칙기반 위험 사전 (초안) — 팀/자문 검토 후 계속 보강
# patterns 는 정규식. 띄어쓰기 변형을 \s* 로 흡수함.
tiers:
  tier1:            # 직접 위험: 자살사고·자해 명시
    weight: 60
    patterns:
      - "죽고\\s*싶"
      - "자살\\s*하고\\s*싶"
      - "자살\\s*할"
      - "그만\\s*살고\\s*싶"
      - "살고\\s*싶지\\s*않"
      - "사라지고\\s*싶"
      - "자해"
      - "목숨을\\s*끊"
  tier2:            # 경고 신호: 절망·무가치·짐·작별
    weight: 25
    patterns:
      - "포기하고\\s*싶"
      - "의미가\\s*없"
      - "짐이\\s*되"
      - "다\\s*끝내고\\s*싶"
      - "희망이\\s*없"
      - "그동안\\s*고마웠"
      - "마지막\\s*인사"
      - "아무\\s*쓸모\\s*없"
  tier3:            # 맥락 신호: 수면·식욕·위축·반복 부정정서
    weight: 8
    patterns:
      - "잠을\\s*못"
      - "잠이\\s*안"
      - "밥맛이\\s*없"
      - "아무도\\s*안\\s*만나"
      - "다\\s*귀찮"
      - "아무것도\\s*하기\\s*싫"
      - "너무\\s*외로"

# 매치 직후 12자 안에 오면 부정으로 보고 무시
negation_after:
  - "^\\s*(지는|진|지)\\s*않"
  - "^\\s*(지|진)\\s*않"
  - "^지\\s*않"
  - "^진\\s*않"
  - "^\\s*지는\\s*않"
past_markers: ["예전에", "예전엔", "작년", "옛날", "었었", "했었", "던 적"]
recovered_markers: ["지금은\\s*괜찮", "요즘은\\s*괜찮", "이제는\\s*괜찮", "나아졌"]
hyperbole:          # 한국어 과장 관용표현 (오탐 주범)
  - "(배고파|졸려|더워|추워|피곤해|힘들어|웃겨|귀찮아)\\s*죽겠"
  - "죽겠네"
intensifiers: ["너무", "진짜", "정말", "매일", "계속"]
laughter: "(ㅋ{2,}|ㅎ{2,}|lol)"
thresholds: {high: 55, mid: 25, low: 8}
